<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FontLens</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="fl-header" role="banner">
    <span class="fl-wordmark" aria-label="FontLens">FontLens</span>

    <div class="fl-mode" role="group" aria-label="Inspection mode">
      <button type="button" id="fl-mode-hover"
              aria-pressed="true" aria-label="Hover mode">Hover</button>
      <button type="button" id="fl-mode-inspect"
              aria-pressed="false" aria-label="Inspect mode">Inspect</button>
    </div>

    <div class="fl-actions">
      <button type="button" id="fl-download" class="fl-icon-btn"
              aria-label="Download type tokens as JSON" title="Download tokens (JSON)" disabled>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 1.5v8.5M8 10l3-3M8 10L5 7"/>
          <path d="M2.5 11.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/>
        </svg>
      </button>
      <button type="button" id="fl-theme-toggle" class="fl-icon-btn"
              aria-label="Toggle dark mode" title="Toggle theme">
        <!-- sun (shown in dark mode → click to go light) -->
        <svg class="fl-icon-sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="3.25"/>
          <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M13 3l-1 1M4 12l-1 1"/>
        </svg>
        <!-- moon (shown in light mode → click to go dark) -->
        <svg class="fl-icon-moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"
             fill="currentColor">
          <path d="M6 1.5a6.5 6.5 0 1 0 8.5 8.5A5.2 5.2 0 0 1 6 1.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="fl-banner" class="fl-banner" role="status" aria-live="polite" hidden>
    <span class="fl-banner-dot" aria-hidden="true"></span>
    <span id="fl-banner-text"></span>
  </div>

  <p id="fl-summary" class="fl-summary" aria-live="polite"></p>

  <main id="fl-region" class="fl-region"
        role="region" aria-label="Detected fonts" tabindex="-1">
    <p class="fl-empty">Navigate to a page with text and try again.</p>
  </main>

  <div id="fl-toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="panel.js"></script>
</body>
</html>
